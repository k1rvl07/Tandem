name: e2e
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.4-alpine
        env:
          POSTGRES_USER: tandem
          POSTGRES_PASSWORD: tandem
          POSTGRES_DB: tandem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tandem -d tandem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2-alpine
        command: redis-server --requirepass secret_redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a secret_redis ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: quay.io/minio/minio:RELEASE.2024-05-27T19-17-46Z
        env:
          MINIO_ROOT_USER: tandem
          MINIO_ROOT_PASSWORD: secret_minio
        command: server /data --console-address ":9001"
        ports:
          - 9000:9000
        options: >-
          --health-cmd "mc ready local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: tandem
      POSTGRES_PASSWORD: tandem
      POSTGRES_DB: tandem
      REDIS_ADDR: 127.0.0.1:6379
      REDIS_PASSWORD: secret_redis
      MINIO_ENDPOINT: 127.0.0.1:9000
      MINIO_ROOT_USER: tandem
      MINIO_ROOT_PASSWORD: secret_minio
      MINIO_BUCKET: tandem-files
      JWT_SECRET: ci_secret
      ADMIN_LOGIN: admin
      ADMIN_PASSWORD: adminpass
      E2E_ADMIN_LOGIN: admin
      E2E_ADMIN_PASSWORD: adminpass
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_PAT }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27'
          cache-dependency-path: tandem-backend/go.sum
      - name: generate swagger docs
        run: |
          go install github.com/swaggo/swag/v2/cmd/swag@v2.0.0-rc5
          swag init -g ./cmd/server/main.go -o ./docs --v3.1
        working-directory: tandem-backend
      - name: check backend formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            gofmt -l .
            exit 1
          fi
        working-directory: tandem-backend
      - name: vet backend
        run: go vet ./...
        working-directory: tandem-backend
      - name: build backend
        run: go build ./...
        working-directory: tandem-backend
      - name: scan backend for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        working-directory: tandem-backend
      - name: run backend unit tests
        run: go test -race -count=1 ./...
        working-directory: tandem-backend
      - name: create integration test database
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          PGPASSWORD=tandem createdb -h 127.0.0.1 -U tandem tandem_test
      - name: run backend integration tests
        env:
          TEST_DATABASE_URL: postgres://tandem:tandem@127.0.0.1:5432/tandem_test?sslmode=disable
          TEST_REDIS_ADDR: 127.0.0.1:6379
          TEST_REDIS_PASSWORD: secret_redis
          TEST_MINIO_ENDPOINT: 127.0.0.1:9000
          TEST_MINIO_ROOT_USER: tandem
          TEST_MINIO_ROOT_PASSWORD: secret_minio
          TEST_MINIO_BUCKET: tandem-files
        run: go test -count=1 ./...
        working-directory: tandem-backend
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tandem-frontend/package-lock.json
      - run: npm ci
        working-directory: tandem-frontend
      - name: scan frontend for known vulnerabilities
        continue-on-error: true
        run: npm audit --audit-level=high
        working-directory: tandem-frontend
      - name: build frontend
        run: npm run build
        working-directory: tandem-frontend
      - name: run frontend unit tests
        run: npx vitest run
        working-directory: tandem-frontend
      - name: check frontend formatting
        run: npm run format:check
        working-directory: tandem-frontend
      - name: lint frontend
        run: npm run lint
        working-directory: tandem-frontend
      - name: install chromium
        run: npx playwright install --with-deps chromium
        working-directory: tandem-frontend
      - name: run e2e tests
        run: npm run test:e2e
        working-directory: tandem-frontend